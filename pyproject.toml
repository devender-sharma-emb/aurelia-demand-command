[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurelia-demand-command"
version = "0.1.0"
description = "Agentic AI for the Marketing & Demand value stream of Aurelia Retail Group (ARchithon 2026)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
live = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aurelia = ["dashboard/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
